name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every step calls a Makefile target. Path lists live in Makefile variables
  # and tool versions in requirements-dev.txt, so CI and a local run cannot
  # inspect different trees with different tools.
  gates:
    name: Gates (make ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: '21'
      - name: Install pinned Python tooling
        run: make install
      # Tools that pip cannot install. Each gate fails when its tool is absent,
      # so a missing install here turns the job red instead of skipping a check.
      - name: Install markdownlint-cli2, shellcheck, gitleaks, cfn-guard
        run: |
          npm install -g markdownlint-cli2@0.22.1
          sudo apt-get update && sudo apt-get install -y shellcheck
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          curl -sSfL https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.2.0/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/cfn-guard-v3-x86_64-ubuntu-latest/cfn-guard /usr/local/bin/cfn-guard
      - name: Run gates
        run: make ci
