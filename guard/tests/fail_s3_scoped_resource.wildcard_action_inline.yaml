AWSTemplateFormatVersion: '2010-09-09'
# Fixture: fails cfn-guard rule s3_scoped_resource only. A role inline policy allows Action '*' on
# Resource '*' (scalar Action). '*' includes every s3: action, so the rule must select this
# statement even though no action string starts with s3:.
Description: Fixture that must fail the s3_scoped_resource rule through a wildcard inline action.
Rules:
  RegionPinned:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', ap-northeast-1]
        AssertDescription: Region pin.
Resources:
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: worker-wildcard
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: '*'
                Resource: '*'
