AWSTemplateFormatVersion: '2010-09-09'
# Fixture: fails cfn-guard rule s3_scoped_resource only. A standalone IAM policy allows Action '*'
# on Resource '*'. '*' includes every s3: action, so the rule must select this statement even
# though no action string starts with s3:.
Description: Fixture that must fail the s3_scoped_resource rule through a wildcard action.
Rules:
  RegionPinned:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', ap-northeast-1]
        AssertDescription: Region pin.
Resources:
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
  WorkerWildcardPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: worker-wildcard
      Roles:
        - !Ref WorkerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: '*'
            Resource: '*'
