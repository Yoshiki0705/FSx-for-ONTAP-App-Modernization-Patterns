AWSTemplateFormatVersion: '2010-09-09'

# Stage-3 add-on stack: run part of the Worker from AWS Lambda through an FSx for ONTAP S3 Access
# Point attached to the same appdata volume. It references only the base stack's exports
# (Fn::ImportValue) and never the reverse, so deleting this stack does not affect appmod-base.
#
# The function is the DocIntake .NET 10 Lambda (handler DocIntake.Lambda::DocIntake.Lambda.Function
# ::Handler). Its source is app/modern/src/DocIntake.Lambda in this repository (packaging steps:
# app/modern/src/DocIntake.Lambda/BUILD.md); the deployment zip is uploaded to the artifacts
# bucket at LambdaPackageKey before create-stack. The region is pinned in the Rules block, which the
# cfn-guard region_pinned rule verifies on this template too. The VPC and subnet come from the base
# stack's exports, and the Lambda gets its own security group, so no resource ID is a parameter.
#
# S3 Access Points have no S3 event notification, so a Worker trigger has to be a poll (Hub
# domain-knowledge). The EventBridge Scheduler schedule is created DISABLED: the measurement runs
# invoke the function by hand (aws lambda invoke), and an enabled poll would bill and write to
# appdata between runs. NetworkOrigin is VPC and the file-system identity is a WINDOWS-type AD user;
# NetworkOrigin cannot be changed after creation, so a change is a re-create, which needs a fresh
# stage3 estimate and approval.

Description: >-
  Stage-3 add-on for the FSx for ONTAP application-modernization Spoke: an AWS Lambda Worker reached
  through an FSx for ONTAP S3 Access Point attached to the appdata volume, with an Amazon EventBridge
  Scheduler poll created disabled. References the base stack's exports only. No Object Lock, no WORM.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Base stack
        Parameters:
          - BaseStackName
      - Label:
          default: Lambda package
        Parameters:
          - ArtifactsBucketName
          - LambdaPackageKey
          - LambdaHandler
          - LambdaRuntime
      - Label:
          default: S3 Access Point
        Parameters:
          - FileSystemIdentityUser

Parameters:
  BaseStackName:
    Type: String
    Default: appmod-base
    Description: >-
      Name of the base stack whose exports (VPC, primary subnet, appdata volume, artifacts bucket)
      this stack imports.

  ArtifactsBucketName:
    Type: String
    Default: ''
    Description: >-
      S3 bucket holding the Lambda deployment package and receiving the Probe results
      (probe/<run-id>/lambda-s3.json). Defaults to the base stack's artifacts bucket via
      Fn::ImportValue when left empty.

  LambdaPackageKey:
    Type: String
    Default: lambda/worker.zip
    Description: >-
      S3 key of the Lambda deployment zip (dotnet publish -r linux-x64 --self-contained false of
      DocIntake.Lambda), uploaded to the artifacts bucket before create-stack.

  LambdaHandler:
    Type: String
    Default: DocIntake.Lambda::DocIntake.Lambda.Function::Handler
    Description: Lambda handler of the DocIntake.Lambda assembly (assembly::type::method).

  # dotnet10 is the managed .NET 10 runtime (Amazon Linux 2023; deprecation listed as 2028-11-14 on
  # the Lambda runtimes page, read 2026-10-11). dotnet8 is not offered: its deprecation is listed as
  # 2026-11-10, under a month away, and Lambda already withholds runtimes due within six months
  # from new regions. provided.al2023 stays as the OS-only alternative; it needs a self-contained
  # bootstrap executable, which the current DocIntake.Lambda zip is not.
  LambdaRuntime:
    Type: String
    Default: dotnet10
    AllowedValues: [dotnet10, provided.al2023]
    Description: >-
      Lambda runtime. dotnet10 runs the framework-dependent DocIntake.Lambda zip; provided.al2023
      needs a self-contained bootstrap build instead.

  FileSystemIdentityUser:
    Type: String
    Default: APPMOD\appsvc
    Description: The WINDOWS-type AD user the S3 Access Point maps the Lambda caller to.

Conditions:
  UseImportedBucket: !Equals [!Ref ArtifactsBucketName, '']

Rules:
  RegionPinned:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', ap-northeast-1]
        AssertDescription: This stack is validated only in ap-northeast-1 (R8.1).

Resources:
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-worker'
      RetentionInDays: 7

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: worker-s3-access-point
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped to the one access point this stack attaches to appdata. Access points take
              # access-point-style ARNs (arn:aws:s3:<region>:<account>:accesspoint/<name>, and
              # .../object/<key> for objects); a bucket-style ARN built from the alias does not work
              # (FSx for ONTAP user guide: Referencing access points; Troubleshooting S3 access
              # point issues). The ARN is the attachment's S3AccessPoint.ResourceARN attribute.
              # ListBucket is granted on the access point ARN, object reads and writes under
              # /object/*. The cfn-guard rule s3_scoped_resource fails if '*' returns here.
              # s3:DeleteObject is not granted: no stage-3 code path deletes (the Probe's S3 variant
              # records acl-evaluation by a real PutObject and does not call CanWrite).
              - Sid: AppDataAccessPointList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AppDataS3AccessPoint.S3AccessPoint.ResourceARN
              - Sid: AppDataAccessPointObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${AppDataS3AccessPoint.S3AccessPoint.ResourceARN}/object/*'
              # The artifacts bucket carries the probe results back (design: build artifacts and
              # probe results pass through it in every stage). Scoped to that one bucket.
              - Sid: ArtifactsBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub
                    - 'arn:${AWS::Partition}:s3:::${Bucket}'
                    - Bucket: !If
                        - UseImportedBucket
                        - !ImportValue
                          'Fn::Sub': '${BaseStackName}-ArtifactsBucket'
                        - !Ref ArtifactsBucketName
                  - !Sub
                    - 'arn:${AWS::Partition}:s3:::${Bucket}/*'
                    - Bucket: !If
                        - UseImportedBucket
                        - !ImportValue
                          'Fn::Sub': '${BaseStackName}-ArtifactsBucket'
                        - !Ref ArtifactsBucketName

  # The Lambda ENIs' own security group: no inbound rule, egress HTTPS only. The function talks to
  # the S3 Access Point and the artifacts bucket through the base stack's S3 gateway endpoint, both
  # on 443; it opens no SMB or NFS connection to the SVM. The destination stays 0.0.0.0/0 because a
  # template cannot portably reference the S3 prefix list, as on the base stack's client group.
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Stage-3 Lambda ENIs. No inbound rules; HTTPS egress only.
      VpcId: !ImportValue
        'Fn::Sub': '${BaseStackName}-VpcId'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: >-
            HTTPS to the S3 Access Point and the artifacts bucket via the S3 gateway endpoint.
            NARROW to the S3 prefix list in production.

  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-worker'
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: !Ref LambdaHandler
      Runtime: !Ref LambdaRuntime
      Timeout: 120
      MemorySize: 512
      Code:
        S3Bucket: !If
          - UseImportedBucket
          - !ImportValue
            'Fn::Sub': '${BaseStackName}-ArtifactsBucket'
          - !Ref ArtifactsBucketName
        S3Key: !Ref LambdaPackageKey
      VpcConfig:
        SubnetIds:
          - !ImportValue
            'Fn::Sub': '${BaseStackName}-PrimarySubnetId'
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      # S3_ACCESS_POINT_ARN is passed to the SDK as the bucket argument (data operations accept the
      # access point ARN or alias). ARTIFACTS_BUCKET receives probe/<run-id>/lambda-s3.json.
      Environment:
        Variables:
          STORE: s3
          FS_IDENTITY: !Ref FileSystemIdentityUser
          S3_ACCESS_POINT_ARN: !GetAtt AppDataS3AccessPoint.S3AccessPoint.ResourceARN
          ARTIFACTS_BUCKET: !If
            - UseImportedBucket
            - !ImportValue
              'Fn::Sub': '${BaseStackName}-ArtifactsBucket'
            - !Ref ArtifactsBucketName
    DependsOn: LambdaLogGroup

  # A poll, because the S3 Access Point emits no S3 event notification. Created DISABLED: the
  # measurement runs invoke the function by hand. To run the poll, update the schedule with
  # --state ENABLED (aws scheduler update-schedule needs the full definition, as teardown.sh does).
  WorkerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${AWS::StackName}-worker-poll'
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: 'rate(5 minutes)'
      State: DISABLED
      Target:
        Arn: !GetAtt WorkerFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-worker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WorkerFunction.Arn

  # Attach an S3 Access Point to the appdata volume. The attachment has create / list / detach only
  # (no update), so changing a value is a re-create (Hub-documented). NetworkOrigin VPC is immutable
  # after creation.
  AppDataS3AccessPoint:
    Type: AWS::FSx::S3AccessPointAttachment
    Properties:
      # Name is also the access point name: 3-50 chars, lower-case, digits and hyphens.
      Name: !Sub '${AWS::StackName}-appdata-ap'
      Type: ONTAP
      OntapConfiguration:
        VolumeId: !ImportValue
          'Fn::Sub': '${BaseStackName}-AppDataVolumeId'
        FileSystemIdentity:
          # WINDOWS identity: the AD user the design maps the caller to. NetworkOrigin is VPC and is
          # immutable, so a change here is a re-create (fresh stage3 estimate + approval).
          Type: WINDOWS
          WindowsUser:
            Name: !Ref FileSystemIdentityUser
      S3AccessPoint:
        VpcConfiguration:
          VpcId: !ImportValue
            'Fn::Sub': '${BaseStackName}-VpcId'

Outputs:
  WorkerFunctionArn:
    Description: The stage-3 Worker Lambda function ARN.
    Value: !GetAtt WorkerFunction.Arn

  ScheduleName:
    Description: The EventBridge Scheduler schedule that polls the inbox (created DISABLED).
    Value: !Ref WorkerSchedule
