AWSTemplateFormatVersion: '2010-09-09'

# Stage-0 base stack for the application-modernization Spoke. It builds the one environment that
# stages 0 through 3 reuse without rebuilding: an Amazon FSx for NetApp ONTAP (hereafter
# "FSx for ONTAP") first-generation Single-AZ file system, an AWS Managed Microsoft AD directory,
# one AD-joined SVM, one NTFS-security-style volume ("appdata"), a Windows client and a Linux
# client, and the artifacts bucket. Everything that only the ONTAP REST API can set (the SMB share,
# export policy rules, NTFS ACEs, name mappings, FlexClones) is done by the scripts under
# scripts/ontap/, not here, because the FSx for ONTAP API has no action for any of them.
#
# Derived read-only from the Hub example examples/multiprotocol-ad/fsxontap-multiprotocol-ad.yaml
# (AD, SVM, domain-join, security-group and client-bootstrap shapes), reduced to a single SVM and a
# single NTFS volume per the design's fixed-value table.
#
# Deliberate deviation from the original design: the design assumed an EXISTING VPC. The real
# verification account is shared, so a no-parameter deploy now builds a fully DEDICATED new
# environment (new VPC + two subnets across two AZs + internet gateway/route + the endpoints +
# a new directory). Five resource kinds are switchable between "create new" (the default) and
# "reuse an existing one by ID": VPC, subnets, the S3 gateway endpoint, the interface endpoints,
# and the AWS Managed Microsoft AD directory. Each has a Create<X> flag (default true) and an
# existing-ID parameter; reuse activates only when the existing ID is supplied AND Create<X> is
# false. Everything else is ALWAYS created new and never switchable: security groups, IAM roles,
# the artifacts bucket, the file system / SVM / volume, and the two EC2 instances.
#
# Only the all-new combination is deployed this run. The reuse combinations are checked STATICALLY
# (cfn-lint + cfn-guard) by scripts/tests/test_reuse_permutations.py, which renders one fixture per
# permutation into a temp dir from this template and never commits them. Not deployed.
#
# Fixed values that MUST NOT become parameters (held by cfn-guard appmod.guard): DeploymentType
# SINGLE_AZ_1, StorageCapacity 1024 GiB, ThroughputCapacity 128 MBps, the appdata volume's NTFS
# SecurityStyle, SnapshotPolicy none, and DeletionPolicy + UpdateReplacePolicy Retain on appdata.
# The Rules block pins the region to ap-northeast-1 (one of the three places that pin lives; the
# others are the cfn-guard rule and deploy.sh).

Description: >-
  Stage-0 base environment for the FSx for ONTAP application-modernization Spoke. A
  first-generation Single-AZ FSx for ONTAP file system (1,024 GiB, 128 MBps), an AWS Managed
  Microsoft AD directory, one AD-joined SVM, one NTFS-security-style volume reused across stages 0
  to 3, a Windows client, a Linux client that is also the ONTAP REST execution host, and an
  artifacts bucket without Object Lock. SnapLock and snapshot locking are NOT used. The SMB share,
  export policy rules, NTFS ACEs and name mappings are set by the ONTAP REST scripts, not here.

Metadata:
  # W1030 is suppressed for this template only. The create-or-reuse pattern gives every Existing<X>
  # parameter an empty-string default (empty means "create new"), and cfn-lint resolves that empty
  # default against the EC2 VPC/Subnet ID format on the reuse branch of each !If. That is a false
  # positive here: the reuse branch is reached only when a real ID is supplied, which the
  # AllowedPattern on each Existing<X> parameter enforces.
  cfn-lint:
    config:
      ignore_checks:
        - W1030
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network (VPC and subnets - create new or reuse by ID)
        Parameters:
          - CreateVpc
          - ExistingVpcId
          - VpcCidr
          - CreateSubnets
          - ExistingPrimarySubnetId
          - ExistingSecondAzSubnetId
          - PrimarySubnetCidr
          - SecondAzSubnetCidr
      - Label:
          default: Network (endpoints and egress)
        Parameters:
          - EgressMode
          - CreateInterfaceEndpoints
          - CreateS3GatewayEndpoint
          - RouteTableIds
      - Label:
          default: Active Directory (create new or reuse by ID)
        Parameters:
          - CreateDirectory
          - ExistingDirectoryId
          - ExistingDirectoryDnsIps
          - DomainName
          - DomainShortName
          - AdAdminSecretName
          - OrganizationalUnitDistinguishedName
      - Label:
          default: File system
        Parameters:
          - FsxAdminSecretName
          - SvmNetBiosName
      - Label:
          default: Clients
        Parameters:
          - WindowsInstanceType
          - LinuxInstanceType
          - WindowsAmiId
          - LinuxAmiId
      - Label:
          default: Naming
        Parameters:
          - NamePrefix

Parameters:
  NamePrefix:
    Type: String
    Default: appmod
    AllowedPattern: '^[a-z][a-z0-9-]{2,20}$'
    Description: >-
      Lower-case prefix for resource names and the artifacts bucket. The SVM and volume names derive
      from it with hyphens removed, because ONTAP accepts only alphanumerics and underscores there.

  # ---- VPC: create new (default) or reuse an existing one by ID ----
  CreateVpc:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      true (default): create a dedicated VPC with two subnets across two AZs, an internet gateway
      and route, and DNS support/hostnames on. false: reuse the VPC named in ExistingVpcId. When
      false you almost always set CreateSubnets false too and supply the existing subnet IDs.

  ExistingVpcId:
    Type: String
    Default: ''
    AllowedPattern: '^(vpc-[0-9a-f]{8,}|)$'
    Description: >-
      Existing VPC ID to reuse. Required when CreateVpc is false; leave empty when CreateVpc is
      true. Run scripts/preflight.sh --phase network --vpc-id <id> against it first.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16  # example CIDR; change to one that does not overlap your network
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: CIDR for the dedicated VPC. Used only when CreateVpc is true.

  # ---- Subnets: create new (default) or reuse existing ones by ID ----
  CreateSubnets:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      true (default): create the primary subnet and a second subnet in a different AZ. false: reuse
      ExistingPrimarySubnetId and ExistingSecondAzSubnetId. AWS Managed Microsoft AD requires two
      subnets across two AZs; the file system stays Single-AZ in the primary subnet.

  ExistingPrimarySubnetId:
    Type: String
    Default: ''
    AllowedPattern: '^(subnet-[0-9a-f]{8,}|)$'
    Description: >-
      Existing primary subnet (file system, both clients, stage-3 Lambda ENIs). Required when
      CreateSubnets is false.

  ExistingSecondAzSubnetId:
    Type: String
    Default: ''
    AllowedPattern: '^(subnet-[0-9a-f]{8,}|)$'
    Description: >-
      Existing subnet in a DIFFERENT AZ, used only by AWS Managed Microsoft AD. Required when
      CreateSubnets is false.

  PrimarySubnetCidr:
    Type: String
    Default: 10.0.0.0/24  # example; must fall within VpcCidr
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: CIDR for the created primary subnet. Used only when CreateSubnets is true.

  SecondAzSubnetCidr:
    Type: String
    Default: 10.0.1.0/24  # example; must fall within VpcCidr and sit in a different AZ
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: CIDR for the created second-AZ subnet. Used only when CreateSubnets is true.

  EgressMode:
    Type: String
    Default: endpoints
    AllowedValues: [nat, endpoints]
    Description: >-
      endpoints: reach the ds, fsx, ssm, ssmmessages, ec2messages and secretsmanager APIs through
      interface VPC endpoints in the primary subnet. nat: reach them through a NAT gateway (the
      dedicated VPC does NOT create one; use nat only against a reused VPC that already has egress).
      Interface endpoints are created only when EgressMode is endpoints AND CreateInterfaceEndpoints
      is true (see CreateInterfaceEndpoints for the precedence).

  CreateInterfaceEndpoints:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      true (default): create the six interface endpoints when EgressMode is endpoints. false: reuse
      interface endpoints that already exist in the VPC (set this when reusing a VPC that already
      carries them). Precedence: endpoints are created only when EgressMode=endpoints AND this is
      true. When EgressMode=nat this flag has no effect and no interface endpoint is created.

  CreateS3GatewayEndpoint:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Create an S3 gateway endpoint so that a VPC-origin FSx for ONTAP S3 Access Point (stage 3) is
      reached as VPC traffic. Created regardless of EgressMode. Set false only when the VPC already
      has an S3 gateway endpoint on the primary subnet's route tables; preflight.sh detects that.
      This is the per-kind reuse switch for the S3 gateway endpoint.

  RouteTableIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      Route table IDs to attach the S3 gateway endpoint to, when reusing a VPC (CreateVpc false).
      Leave empty when CreateVpc is true: the endpoint then attaches to the route table this
      template creates. Required when CreateS3GatewayEndpoint is true and CreateVpc is false.
      preflight.sh prints the route tables associated with the primary subnet.

  # ---- AWS Managed Microsoft AD: create new (default) or reuse an existing directory by ID ----
  CreateDirectory:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      true (default): create an AWS Managed Microsoft AD (Standard) directory. false: reuse the
      directory named in ExistingDirectoryId and its ExistingDirectoryDnsIps. DomainName,
      DomainShortName and OrganizationalUnitDistinguishedName must match the reused directory.

  ExistingDirectoryId:
    Type: String
    Default: ''
    AllowedPattern: '^(d-[0-9a-f]{10}|)$'
    Description: Existing directory ID (d-xxxxxxxxxx) to reuse. Required when CreateDirectory is false.

  ExistingDirectoryDnsIps:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      The two domain controller IP addresses of the reused directory, for the SVM join and the SSM
      domain-join association. Required when CreateDirectory is false. Example: 10.0.x.x,10.0.x.x.

  DomainName:
    Type: String
    Default: appmod.example.com
    AllowedPattern: '^([a-zA-Z0-9]+[\.-])+([a-zA-Z0-9])+$'
    Description: >-
      Fully qualified domain name for the directory. Resolves inside the VPC only; it does not need
      to be publicly resolvable. When CreateDirectory is false this must match the reused directory.

  DomainShortName:
    Type: String
    Default: APPMOD
    AllowedPattern: '^[A-Za-z0-9]{1,15}$'
    Description: NetBIOS name of the domain. The SVM NetBIOS name below must differ from this value.

  AdAdminSecretName:
    Type: String
    Default: appmod/ad-admin
    MinLength: 1
    Description: >-
      Name or ARN of an existing Secrets Manager secret with a JSON "password" key, for the
      directory's Admin user and reused as the service account that joins the SVM. Created by
      scripts/create-secrets.sh before this stack. Directory Service requires 8 to 64 characters
      with three of the four character classes.

  OrganizationalUnitDistinguishedName:
    Type: String
    Default: OU=Computers,OU=APPMOD,DC=appmod,DC=example,DC=com
    MinLength: 1
    Description: >-
      Distinguished name of the OU that holds the SVM computer object. For AWS Managed Microsoft AD
      this MUST include the intermediate OU that AWS inserts:
      OU=Computers,OU=<DomainShortName>,DC=<label>,DC=<label>. Omitting it does not fail validation;
      the join fails afterwards and the SVM settles in MISCONFIGURED. (Hub domain-knowledge: the
      intermediate OU is the usual cause of a MISCONFIGURED SVM.)

  FsxAdminSecretName:
    Type: String
    Default: appmod/fsxadmin
    MinLength: 1
    Description: >-
      Name or ARN of an existing Secrets Manager secret with a JSON "password" key for the ONTAP
      fsxadmin account. Resolved at create time, so the password appears in no parameter value,
      output or log. FSx for ONTAP accepts 8 to 50 characters.

  SvmNetBiosName:
    Type: String
    Default: APPMODSVM01
    AllowedPattern: '^[A-Za-z0-9]{1,15}$'
    Description: >-
      NetBIOS name of the SVM. 15 alphanumerics or fewer, different from DomainShortName, unique in
      the domain. On a join failure, change this (and never reuse a failed name) only before the b0
      boundary record is taken; after that, rebuild the environment per the design.

  WindowsInstanceType:
    Type: String
    Default: t3.large
    Description: Windows client that runs the .NET Framework 4.8 source app and sets NTFS ACEs over SMB.

  LinuxInstanceType:
    Type: String
    Default: t3.medium
    Description: >-
      Linux client. The ONTAP REST execution host, the second SMB client for the two-client probes,
      and (stage 2) the host for the migrated app. Chosen for cost; do not measure throughput on it.

  WindowsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base
    Description: Resolved from the AWS-published SSM public parameter so no AMI ID is pinned here.

  LinuxAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Resolved from the AWS-published SSM public parameter so no AMI ID is pinned here.

# The region is pinned in three independent places (template Rules here, the cfn-guard
# region_pinned rule, and deploy.sh). Rules fail the create/update call itself, before any resource
# is touched, when the stack is launched outside ap-northeast-1.
Rules:
  RegionPinned:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', ap-northeast-1]
        AssertDescription: This stack is validated only in ap-northeast-1 (R8.1).

Conditions:
  # Per-resource-kind reuse switches. Each resource of a switchable kind is created when its
  # Create<X> flag is true, and reused (referenced by the supplied existing ID) when it is false.
  MakeVpc: !Equals [!Ref CreateVpc, 'true']
  MakeSubnets: !Equals [!Ref CreateSubnets, 'true']
  # A dedicated new VPC always creates its own subnets and route associations. Reusing subnets from
  # a VPC this template just created is not a supported combination (CreateVpc true requires
  # CreateSubnets true); this condition gates the created route associations on both being true.
  MakeVpcAndSubnets: !And
    - !Equals [!Ref CreateVpc, 'true']
    - !Equals [!Ref CreateSubnets, 'true']
  MakeDirectory: !Equals [!Ref CreateDirectory, 'true']
  # Interface endpoints: created only when egress is endpoints AND the create switch is on.
  # EgressMode=nat (or CreateInterfaceEndpoints=false) suppresses them. This is the documented
  # precedence between EgressMode and the per-kind interface-endpoint switch.
  MakeClientEndpoints: !And
    - !Equals [!Ref EgressMode, endpoints]
    - !Equals [!Ref CreateInterfaceEndpoints, 'true']
  MakeS3GatewayEndpoint: !Equals [!Ref CreateS3GatewayEndpoint, 'true']
  FsxSecretGivenAsArn: !Equals [!Select [0, !Split [':', !Ref FsxAdminSecretName]], 'arn']
  AdSecretGivenAsArn: !Equals [!Select [0, !Split [':', !Ref AdAdminSecretName]], 'arn']

Resources:

  # ------------------------------------------------------------------ dedicated VPC (CreateVpc)
  #
  # Created only when CreateVpc is true (the default). The minimum a seamless AWS Managed Microsoft
  # AD domain join and AWS Systems Manager need: a VPC with DNS support and hostnames on, two
  # subnets in two AZs, an internet gateway and a default route so SSM and the AD join reach the
  # AWS APIs when EgressMode=endpoints is not relied on. (Interface endpoints still carry the
  # ds/fsx/ssm/secretsmanager traffic privately; the IGW route is the baseline egress for anything
  # not fronted by an endpoint. The dedicated VPC does not create a NAT gateway, so EgressMode=nat
  # is meaningful only against a reused VPC that already has one.)

  Vpc:
    Condition: MakeVpc
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-vpc'
        - Key: appmod
          Value: base

  InternetGateway:
    Condition: MakeVpc
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-igw'
        - Key: appmod
          Value: base

  InternetGatewayAttachment:
    Condition: MakeVpc
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Created when CreateSubnets is true. AWS Managed Microsoft AD requires two subnets across two
  # AZs; the first two AZs in the region are selected with Fn::GetAZs so no AZ name is pinned.
  PrimarySubnet:
    Condition: MakeSubnets
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      CidrBlock: !Ref PrimarySubnetCidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-primary'
        - Key: appmod
          Value: base

  SecondAzSubnet:
    Condition: MakeSubnets
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      CidrBlock: !Ref SecondAzSubnetCidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-second-az'
        - Key: appmod
          Value: base

  RouteTable:
    Condition: MakeVpc
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-rt'
        - Key: appmod
          Value: base

  DefaultRoute:
    Condition: MakeVpc
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Both created subnets associate with the created route table. These exist only when both the VPC
  # and the subnets are created new (reuse paths bring their own associations).
  PrimarySubnetRouteAssociation:
    Condition: MakeVpcAndSubnets
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref PrimarySubnet

  SecondAzSubnetRouteAssociation:
    Condition: MakeVpcAndSubnets
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref SecondAzSubnet

  # ------------------------------------------------------------------ directory (CreateDirectory)

  Directory:
    Condition: MakeDirectory
    Type: AWS::DirectoryService::MicrosoftAD
    Properties:
      Name: !Ref DomainName
      ShortName: !Ref DomainShortName
      # Standard is the cheaper edition and is sufficient here. Edition cannot be changed without
      # replacing the directory, and R7.4 forbids promoting Standard to Enterprise.
      Edition: Standard
      Password: !Sub '{{resolve:secretsmanager:${AdAdminSecretName}:SecretString:password}}'
      VpcSettings:
        VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
        SubnetIds:
          - !If [MakeSubnets, !Ref PrimarySubnet, !Ref ExistingPrimarySubnetId]
          - !If [MakeSubnets, !Ref SecondAzSubnet, !Ref ExistingSecondAzSubnetId]

  # ------------------------------------------------------------------ security groups

  ClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Windows and Linux clients for the app-modernization base stack. No inbound rules.
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      # Egress enumerated by port rather than left as all-protocols. The destination CIDR stays
      # 0.0.0.0/0 on rules that leave the VPC because a template cannot portably discover the VPC
      # CIDR or the S3 prefix list; narrow those to the VPC CIDR and the S3 prefix list in a
      # production copy. This is a verification environment, not a production reference.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: >-
            HTTPS. Systems Manager, Secrets Manager, Directory Service, FSx for ONTAP interface
            endpoints, the S3 gateway endpoint, and the ONTAP REST endpoint. NARROW in production.
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS over TCP to the domain controllers. NARROW TO THE VPC CIDR in production
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS to the domain controllers. NARROW TO THE VPC CIDR in production
        - IpProtocol: tcp
          FromPort: 88
          ToPort: 88
          CidrIp: 0.0.0.0/0
          Description: Kerberos. NARROW TO THE VPC CIDR in production
        - IpProtocol: udp
          FromPort: 88
          ToPort: 88
          CidrIp: 0.0.0.0/0
          Description: Kerberos. NARROW TO THE VPC CIDR in production
        - IpProtocol: udp
          FromPort: 123
          ToPort: 123
          CidrIp: 0.0.0.0/0
          Description: NTP. Kerberos fails on clock skew, so this is not optional. NARROW in production
        - IpProtocol: tcp
          FromPort: 135
          ToPort: 135
          CidrIp: 0.0.0.0/0
          Description: RPC endpoint mapper for the Windows administration tools. NARROW in production
        - IpProtocol: tcp
          FromPort: 389
          ToPort: 389
          CidrIp: 0.0.0.0/0
          Description: LDAP. NARROW TO THE VPC CIDR in production
        - IpProtocol: udp
          FromPort: 389
          ToPort: 389
          CidrIp: 0.0.0.0/0
          Description: LDAP ping / CLDAP. NARROW TO THE VPC CIDR in production
        - IpProtocol: tcp
          FromPort: 445
          ToPort: 445
          CidrIp: 0.0.0.0/0
          Description: SMB to the domain controllers, for the join and group policy. NARROW in production
        - IpProtocol: tcp
          FromPort: 464
          ToPort: 464
          CidrIp: 0.0.0.0/0
          Description: Kerberos password change. NARROW TO THE VPC CIDR in production
        - IpProtocol: udp
          FromPort: 464
          ToPort: 464
          CidrIp: 0.0.0.0/0
          Description: Kerberos password change. NARROW TO THE VPC CIDR in production
        - IpProtocol: tcp
          FromPort: 636
          ToPort: 636
          CidrIp: 0.0.0.0/0
          Description: LDAPS. NARROW TO THE VPC CIDR in production
        - IpProtocol: tcp
          FromPort: 3268
          ToPort: 3269
          CidrIp: 0.0.0.0/0
          Description: Global catalog. NARROW TO THE VPC CIDR in production
        - IpProtocol: tcp
          FromPort: 49152
          ToPort: 65535
          CidrIp: 0.0.0.0/0
          Description: Dynamic RPC range for the Windows administration tools. NARROW in production
        # NFS and SMB to the file system reference the file system's group, the one place the
        # destination can be named exactly.
        - IpProtocol: tcp
          FromPort: 111
          ToPort: 111
          DestinationSecurityGroupId: !Ref FileSystemSecurityGroup
          Description: rpcbind
        - IpProtocol: udp
          FromPort: 111
          ToPort: 111
          DestinationSecurityGroupId: !Ref FileSystemSecurityGroup
          Description: rpcbind
        - IpProtocol: tcp
          FromPort: 635
          ToPort: 635
          DestinationSecurityGroupId: !Ref FileSystemSecurityGroup
          Description: NFS mount
        - IpProtocol: udp
          FromPort: 635
          ToPort: 635
          DestinationSecurityGroupId: !Ref FileSystemSecurityGroup
          Description: NFS mount
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          DestinationSecurityGroupId: !Ref FileSystemSecurityGroup
          Description: NFS
        - IpProtocol: udp
          FromPort: 2049
          ToPort: 2049
          DestinationSecurityGroupId: !Ref FileSystemSecurityGroup
          Description: NFS
        - IpProtocol: tcp
          FromPort: 4045
          ToPort: 4046
          DestinationSecurityGroupId: !Ref FileSystemSecurityGroup
          Description: NFS lock manager
        - IpProtocol: udp
          FromPort: 4045
          ToPort: 4046
          DestinationSecurityGroupId: !Ref FileSystemSecurityGroup
          Description: NFS lock manager
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-clients'
        - Key: appmod
          Value: base

  FileSystemSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FSx for ONTAP file system for the app-modernization base stack.
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      # The SVM reaches the domain controllers for the join and, afterwards, for SMB authentication
      # and AD identity resolution. Enumerated for the same reason as the client group.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS over TCP to the domain controllers. NARROW TO THE VPC CIDR in production
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS to the domain controllers. NARROW TO THE VPC CIDR in production
        - IpProtocol: tcp
          FromPort: 88
          ToPort: 88
          CidrIp: 0.0.0.0/0
          Description: Kerberos. NARROW TO THE VPC CIDR in production
        - IpProtocol: udp
          FromPort: 88
          ToPort: 88
          CidrIp: 0.0.0.0/0
          Description: Kerberos. NARROW TO THE VPC CIDR in production
        - IpProtocol: udp
          FromPort: 123
          ToPort: 123
          CidrIp: 0.0.0.0/0
          Description: NTP. Kerberos fails on clock skew. NARROW TO THE VPC CIDR in production
        - IpProtocol: tcp
          FromPort: 389
          ToPort: 389
          CidrIp: 0.0.0.0/0
          Description: LDAP. NARROW TO THE VPC CIDR in production
        - IpProtocol: udp
          FromPort: 389
          ToPort: 389
          CidrIp: 0.0.0.0/0
          Description: LDAP ping / CLDAP. NARROW TO THE VPC CIDR in production
        - IpProtocol: tcp
          FromPort: 445
          ToPort: 445
          CidrIp: 0.0.0.0/0
          Description: SMB to the domain controllers. NARROW TO THE VPC CIDR in production
        - IpProtocol: tcp
          FromPort: 464
          ToPort: 464
          CidrIp: 0.0.0.0/0
          Description: Kerberos password change. NARROW TO THE VPC CIDR in production
        - IpProtocol: udp
          FromPort: 464
          ToPort: 464
          CidrIp: 0.0.0.0/0
          Description: Kerberos password change. NARROW TO THE VPC CIDR in production
        - IpProtocol: tcp
          FromPort: 636
          ToPort: 636
          CidrIp: 0.0.0.0/0
          Description: LDAPS. NARROW TO THE VPC CIDR in production
        - IpProtocol: tcp
          FromPort: 3268
          ToPort: 3269
          CidrIp: 0.0.0.0/0
          Description: Global catalog. NARROW TO THE VPC CIDR in production
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-fs'
        - Key: appmod
          Value: base

  # Client-reached AWS endpoints (EgressMode endpoints only). One security group serves them all:
  # same instances, same port, same reason.
  ClientEndpointSecurityGroup:
    Condition: MakeClientEndpoints
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface endpoints for the app-modernization base stack.
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref ClientSecurityGroup
          Description: HTTPS from the clients calling the ds, fsx, ssm and secretsmanager APIs
      # Inert: an interface-endpoint ENI answers requests and does not originate connections, so no
      # egress rule is evaluated. Written out so the template is not more restrictive than reality.
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Inert; an endpoint interface does not originate connections
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-client-endpoints'
        - Key: appmod
          Value: base

  DirectoryServiceEndpoint:
    Condition: MakeClientEndpoints
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ds'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !If [MakeSubnets, !Ref PrimarySubnet, !Ref ExistingPrimarySubnetId]
      SecurityGroupIds:
        - !Ref ClientEndpointSecurityGroup

  FsxApiEndpoint:
    Condition: MakeClientEndpoints
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.fsx'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !If [MakeSubnets, !Ref PrimarySubnet, !Ref ExistingPrimarySubnetId]
      SecurityGroupIds:
        - !Ref ClientEndpointSecurityGroup

  SsmEndpoint:
    Condition: MakeClientEndpoints
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !If [MakeSubnets, !Ref PrimarySubnet, !Ref ExistingPrimarySubnetId]
      SecurityGroupIds:
        - !Ref ClientEndpointSecurityGroup

  SsmMessagesEndpoint:
    Condition: MakeClientEndpoints
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !If [MakeSubnets, !Ref PrimarySubnet, !Ref ExistingPrimarySubnetId]
      SecurityGroupIds:
        - !Ref ClientEndpointSecurityGroup

  Ec2MessagesEndpoint:
    Condition: MakeClientEndpoints
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !If [MakeSubnets, !Ref PrimarySubnet, !Ref ExistingPrimarySubnetId]
      SecurityGroupIds:
        - !Ref ClientEndpointSecurityGroup

  SecretsManagerEndpoint:
    Condition: MakeClientEndpoints
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !If [MakeSubnets, !Ref PrimarySubnet, !Ref ExistingPrimarySubnetId]
      SecurityGroupIds:
        - !Ref ClientEndpointSecurityGroup

  # S3 gateway endpoint, created regardless of EgressMode (CreateS3GatewayEndpoint controls it). A
  # NAT-routed request leaves to the public S3 endpoint and is unlikely to be treated as VPC-origin
  # by a VPC-origin S3 Access Point in stage 3; the gateway endpoint keeps the path VPC-origin.
  S3GatewayEndpoint:
    Condition: MakeS3GatewayEndpoint
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      # Attach to the route table this template creates (dedicated VPC) or to the supplied route
      # tables (reused VPC). RouteTableIds must be non-empty when reusing a VPC.
      RouteTableIds: !If
        - MakeVpc
        - [!Ref RouteTable]
        - !Ref RouteTableIds

  SmbFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 445
      ToPort: 445
      SourceSecurityGroupId: !Ref ClientSecurityGroup
      Description: SMB

  NfsTcpFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref ClientSecurityGroup
      Description: NFS

  NfsUdpFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: udp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref ClientSecurityGroup
      Description: NFS

  RpcBindTcpFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 111
      ToPort: 111
      SourceSecurityGroupId: !Ref ClientSecurityGroup
      Description: RPC bind

  RpcBindUdpFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: udp
      FromPort: 111
      ToPort: 111
      SourceSecurityGroupId: !Ref ClientSecurityGroup
      Description: RPC bind

  MountdTcpFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 635
      ToPort: 635
      SourceSecurityGroupId: !Ref ClientSecurityGroup
      Description: mountd

  MountdUdpFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: udp
      FromPort: 635
      ToPort: 635
      SourceSecurityGroupId: !Ref ClientSecurityGroup
      Description: mountd

  LockingTcpFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 4045
      ToPort: 4046
      SourceSecurityGroupId: !Ref ClientSecurityGroup
      Description: NLM and NSM

  LockingUdpFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: udp
      FromPort: 4045
      ToPort: 4046
      SourceSecurityGroupId: !Ref ClientSecurityGroup
      Description: NLM and NSM

  OntapRestFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FileSystemSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref ClientSecurityGroup
      Description: >-
        ONTAP REST API. The SMB share, export policy rules, name mappings and FlexClones have no
        FSx for ONTAP API action, so the Linux client calls ONTAP REST directly.

  # ------------------------------------------------------------------ IAM

  WindowsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonSSMDirectoryServiceAccess
      Policies:
        # The Windows host reads the AD admin secret and the app-users secret, to create the test
        # users (appsvc, appreader) with the Active Directory administration tools (no AWS API
        # exists for that): the AD admin secret is the directory credential, the app-users secret
        # holds the passwords the two accounts are created with (scripts/create-ad-users.ps1). It
        # never holds the fsxadmin cluster credential. The app-users grant is scoped to that one
        # secret only. (The running appmod-base stack was patched out-of-band with the same grant
        # via put-role-policy before this template carried it; see design.md.)
        - PolicyName: read-ad-admin-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !If
                    - AdSecretGivenAsArn
                    - !Ref AdAdminSecretName
                    - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdAdminSecretName}-??????'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${NamePrefix}/app-users-??????'
        # The Windows host reads the source and writes build output / inventory through the
        # artifacts bucket (DocIntake build in stage 0, probe inventory). Scoped to that bucket
        # only. (The running appmod-base stack was patched out-of-band with the same grant via
        # put-role-policy before this template carried it; see design.md.)
        - PolicyName: artifacts-bucket-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub '${ArtifactsBucket.Arn}/*'

  WindowsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WindowsRole

  LinuxRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonSSMDirectoryServiceAccess
      Policies:
        # The Linux host reads the fsxadmin, ad-admin, app-users and ontap-itclone secrets. During
        # stage 2 the fsxadmin secret is made unreadable from this role by a resource policy that
        # scripts/aimf/lock-fsxadmin.sh applies, so an SSM-reachable agent cannot reach fsxadmin and
        # enable snapshot locking. The grant here is the standing one; the Deny is layered at
        # runtime.
        - PolicyName: read-base-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !If
                    - FsxSecretGivenAsArn
                    - !Ref FsxAdminSecretName
                    - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${FsxAdminSecretName}-??????'
                  - !If
                    - AdSecretGivenAsArn
                    - !Ref AdAdminSecretName
                    - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AdAdminSecretName}-??????'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${NamePrefix}/app-users-??????'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${NamePrefix}/ontap-itclone-??????'
        - PolicyName: describe-fsx
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - fsx:DescribeFileSystems
                  - fsx:DescribeStorageVirtualMachines
                  - fsx:DescribeVolumes
                Resource: '*'
        - PolicyName: artifacts-bucket-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub '${ArtifactsBucket.Arn}/*'

  LinuxInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref LinuxRole

  # ------------------------------------------------------------------ artifacts bucket

  # Build artifacts and probe results pass through here. No Object Lock and no versioning (the
  # cfn-guard no_object_lock rule rejects an Object Lock configuration here). Encryption and a
  # public-access block are on; the bucket is emptied in the teardown order before the stack is
  # deleted.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${NamePrefix}-artifacts-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: appmod
          Value: base

  # ------------------------------------------------------------------ file system

  FileSystem:
    Type: AWS::FSx::FileSystem
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      FileSystemType: ONTAP
      StorageType: SSD
      # Fixed by cfn-guard minimum_fsx: 1024 GiB. Not a parameter.
      StorageCapacity: 1024
      SubnetIds:
        - !If [MakeSubnets, !Ref PrimarySubnet, !Ref ExistingPrimarySubnetId]
      SecurityGroupIds:
        - !Ref FileSystemSecurityGroup
      OntapConfiguration:
        # Fixed by cfn-guard minimum_fsx: SINGLE_AZ_1 and 128 MBps, neither a parameter. HAPairs is
        # unset because the first generation has exactly one pair. Deployment type cannot change
        # after creation.
        DeploymentType: SINGLE_AZ_1
        ThroughputCapacity: 128
        DiskIopsConfiguration:
          Mode: AUTOMATIC
        FsxAdminPassword: !Sub '{{resolve:secretsmanager:${FsxAdminSecretName}:SecretString:password}}'
        # Backups off. A retained backup outlives the stack and keeps being billed, and the design's
        # teardown deletes the volume with SkipFinalBackup=true.
        AutomaticBackupRetentionDays: 0
      Tags:
        - Key: Name
          Value: !Ref NamePrefix
        - Key: appmod
          Value: base

  # ------------------------------------------------------------------ SVM

  # One AD-joined SVM. The root volume is UNIX so that NFS clients can traverse the namespace in
  # stage 1 (an NTFS-style root denies the LOOKUP that traversal needs, which reads as a child
  # volume error; Hub measurement). The appdata volume sets NTFS explicitly, so the security style
  # under test is a property of the volume, not of the root.
  Svm:
    Type: AWS::FSx::StorageVirtualMachine
    Properties:
      FileSystemId: !Ref FileSystem
      Name: !Join ['', !Split ['-', !Sub '${NamePrefix}svm']]
      RootVolumeSecurityStyle: UNIX
      ActiveDirectoryConfiguration:
        NetBiosName: !Ref SvmNetBiosName
        SelfManagedActiveDirectoryConfiguration:
          DnsIps: !If [MakeDirectory, !GetAtt Directory.DnsIpAddresses, !Ref ExistingDirectoryDnsIps]
          DomainName: !Ref DomainName
          # Domain Admins is what works for the SVM join. The administrators group AWS delegates in
          # the domain has been measured to have insufficient permissions and leaves the SVM in
          # MISCONFIGURED (Hub domain-knowledge). Its literal name is given on the next line.
          # 'AWS Delegated FSx Administrators'  # allow:naming (literal AD group name, not a product)
          FileSystemAdministratorsGroup: Domain Admins
          OrganizationalUnitDistinguishedName: !Ref OrganizationalUnitDistinguishedName
          UserName: Admin
          Password: !Sub '{{resolve:secretsmanager:${AdAdminSecretName}:SecretString:password}}'
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-svm'
        - Key: appmod
          Value: base

  # ------------------------------------------------------------------ volume

  # The target volume, reused unchanged across stages 0 to 3.
  #
  # DeletionPolicy and UpdateReplacePolicy are both Retain (held by cfn-guard volume_retained): a
  # stack delete or a replacing update must never take the data with it on CloudFormation's own
  # judgement. The volume is instead deleted explicitly by teardown.sh with
  # SkipFinalBackup=true. Because of Retain, a failed create or a stack delete can stop at
  # DELETE_FAILED on the SVM/file system while appdata remains; teardown.sh --after-failed-create
  # handles that path.
  AppDataVolume:
    Type: AWS::FSx::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: appdata
      VolumeType: ONTAP
      OntapConfiguration:
        StorageVirtualMachineId: !Ref Svm
        SizeInBytes: '10737418240'
        OntapVolumeType: RW
        SecurityStyle: NTFS
        StorageEfficiencyEnabled: 'true'
        JunctionPath: /appdata
        # Fixed by cfn-guard snapshot_policy_none. Snapshots are created manually (no retention)
        # and never through a policy, so no retention-bearing policy can be attached by accident.
        SnapshotPolicy: none
        TieringPolicy:
          Name: NONE
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-appdata'
        - Key: appmod
          Value: base

  # ------------------------------------------------------------------ clients

  WindowsClient:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref WindowsAmiId
      InstanceType: !Ref WindowsInstanceType
      IamInstanceProfile: !Ref WindowsInstanceProfile
      SubnetId: !If [MakeSubnets, !Ref PrimarySubnet, !Ref ExistingPrimarySubnetId]
      SecurityGroupIds:
        - !Ref ClientSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          <powershell>
          # RSAT-AD-Tools pulls in the Active Directory administration tools used to create the
          # appsvc and appreader users (no AWS API exists for that). RSAT-AD-PowerShell is used by
          # inventory.ps1 only incidentally. MSBuild for .NET Framework 4.x ships with the AMI; U18
          # (task 1.7) records the fallback if it does not.
          Install-WindowsFeature -Name RSAT-AD-PowerShell,RSAT-AD-Tools
          </powershell>
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-win'
        - Key: appmod
          Value: base

  LinuxClient:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LinuxAmiId
      InstanceType: !Ref LinuxInstanceType
      IamInstanceProfile: !Ref LinuxInstanceProfile
      SubnetId: !If [MakeSubnets, !Ref PrimarySubnet, !Ref ExistingPrimarySubnetId]
      SecurityGroupIds:
        - !Ref ClientSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # cifs-utils for the stage-0 second SMB client, nfs-utils and nfs4-acl-tools for stage 1,
          # jq and curl for the ONTAP REST scripts. CREATE_COMPLETE does not mean this finished:
          # there is no CreationPolicy. Check: command -v nfs4_getfacl && command -v jq, and read
          # /var/log/appmod-setup.log on failure.
          dnf install -y nfs-utils nfs4-acl-tools cifs-utils jq >/var/log/appmod-setup.log 2>&1
          systemctl enable --now rpcbind >>/var/log/appmod-setup.log 2>&1
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-linux'
        - Key: appmod
          Value: base

  JoinDomainAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: !Sub '${NamePrefix}-join-domain'
      Name: AWS-JoinDirectoryServiceDomain
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref WindowsClient
            - !Ref LinuxClient
      Parameters:
        directoryId:
          - !If [MakeDirectory, !Ref Directory, !Ref ExistingDirectoryId]
        directoryName:
          - !Ref DomainName
        dnsIpAddresses: !If [MakeDirectory, !GetAtt Directory.DnsIpAddresses, !Ref ExistingDirectoryDnsIps]

Outputs:
  FileSystemId:
    Description: Pass this to the scripts as --file-system-id.
    Value: !Ref FileSystem
    Export:
      Name: !Sub '${AWS::StackName}-FileSystemId'

  DirectoryId:
    Description: The AWS Managed Microsoft AD directory ID (created or reused).
    Value: !If [MakeDirectory, !Ref Directory, !Ref ExistingDirectoryId]
    Export:
      Name: !Sub '${AWS::StackName}-DirectoryId'

  DirectoryDnsIps:
    Description: >-
      Domain controller addresses. An AD-joined SVM needs these reachable after the join for SMB
      authentication and AD identity resolution.
    Value: !If
      - MakeDirectory
      - !Join [',', !GetAtt Directory.DnsIpAddresses]
      - !Join [',', !Ref ExistingDirectoryDnsIps]

  VpcId:
    Description: The VPC in use (created or reused). Stage 3 places the Lambda ENIs here.
    Value: !If [MakeVpc, !Ref Vpc, !Ref ExistingVpcId]
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  PrimarySubnetId:
    Description: Primary subnet (file system, both clients, stage-3 Lambda ENIs).
    Value: !If [MakeSubnets, !Ref PrimarySubnet, !Ref ExistingPrimarySubnetId]
    Export:
      Name: !Sub '${AWS::StackName}-PrimarySubnetId'

  SvmName:
    Description: Pass this to the ONTAP scripts as --svm.
    Value: !Join ['', !Split ['-', !Sub '${NamePrefix}svm']]
    Export:
      Name: !Sub '${AWS::StackName}-SvmName'

  SvmNetBiosName:
    Description: The SVM NetBIOS name; the SMB share path is \\<this>\appdata.
    Value: !Ref SvmNetBiosName

  AppDataVolumeName:
    Description: The target volume. NTFS security style, reused across all stages.
    Value: appdata

  AppDataVolumeId:
    Description: The target volume ID (fsvol-...). Stage 3 attaches the S3 Access Point to this.
    Value: !Ref AppDataVolume
    Export:
      Name: !Sub '${AWS::StackName}-AppDataVolumeId'

  ArtifactsBucketName:
    Description: Build artifacts and probe results pass through here.
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${AWS::StackName}-ArtifactsBucket'

  WindowsClientInstanceId:
    Description: Connect with "aws ssm start-session --target <this>".
    Value: !Ref WindowsClient
    Export:
      Name: !Sub '${AWS::StackName}-WindowsClientInstanceId'

  LinuxClientInstanceId:
    Description: Connect with "aws ssm start-session --target <this>".
    Value: !Ref LinuxClient
    Export:
      Name: !Sub '${AWS::StackName}-LinuxClientInstanceId'

  BeforeYouStart:
    Description: >-
      Check the SVM reached CREATED and not MISCONFIGURED before running anything. A join that
      failed on the OU path or on the administrators group leaves the stack at CREATE_COMPLETE.
    Value: >-
      aws fsx describe-storage-virtual-machines --query
      'StorageVirtualMachines[].[Name,Lifecycle,LifecycleTransitionReason.Message]' --output table
